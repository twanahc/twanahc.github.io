---
layout: default
title: Home
---

<h2>Posts</h2>

{% for post in site.posts %}
  <article>
    <h3>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h3>
    <p><em>{{ post.date | date: "%B %d, %Y" }}</em>
    {% if post.category %} &middot; {{ post.category }}{% endif %}
    </p>
    <hr>
  </article>
{% else %}
  <p><em>Nothing here yet.</em></p>
{% endfor %}
